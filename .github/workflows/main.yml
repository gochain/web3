name: ci-and-release

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Unit & CLI Tests
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, 'skip ci')
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Bump version
        run: |
          git config --global user.email "ci@gochain.io"
          git config --global user.name "CI"
          git fetch --tags
          wget -O - https://raw.githubusercontent.com/treeder/bump/master/gitbump.sh | bash
          echo "VERSION=$(git tag --sort=-v:refname --list 'v[0-9]*' | head -n 1 | cut -c 2-)" >> $GITHUB_ENV

      - name: Cross-compile pure-Go binaries
        env:
          CGO_ENABLED: "0"
        run: |
          echo "Building version: $VERSION"
          LDFLAGS="-s -w -X main.Version=$VERSION"

          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o web3_linux       ./cmd/web3
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o web3_linux_arm64 ./cmd/web3
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o web3_mac         ./cmd/web3
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o web3_mac_arm64   ./cmd/web3
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o web3.exe         ./cmd/web3

      - name: GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "web3_linux, web3_linux_arm64, web3_mac, web3_mac_arm64, web3.exe"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          allowUpdates: true

      - name: Docker release
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          if [ -z "$DOCKER_USER" ]; then
            echo "DOCKER_USER secret not set, skipping Docker Hub push."
            exit 0
          fi
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker build --build-arg VERSION="$VERSION" -t gochain/web3:latest .
          docker tag gochain/web3:latest "gochain/web3:$VERSION"
          docker push "gochain/web3:$VERSION"
          docker push gochain/web3:latest
